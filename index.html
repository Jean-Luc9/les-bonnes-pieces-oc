<!DOCTYPE html>
<html lang="fr">

<head>
	<meta charset="utf-8">
	<title>Les Bonnes Pièces</title>
	<link rel="stylesheet" href="styles.css">
	<script type="module" src="pieces.js" defer></script>
</head>

<body>
	<header>
		<img src="images/logo-les-bonnes-pieces.png" alt="LOGO">
		<h1>Les Bonnes Pièces</h1>
	</header>
	<main>
		<!-- Menu de recherche -->
		<section class="filtres">
			<h3>Filtres</h3>
			<button class="btn-trier">Trier par prix croissant</button>
			<br>
			<button class="btn-filtrer">Filtrer les pièces non abordables</button>
			<br>
			<button class="btn-filtrer-par-descrption">Filtrer les fichier ayant une description</button>
			<br>
			<button class="btn-trier-decroissant">Trier par ordre décroissant</button>
			<br>
			<input type="range" name="prix-pr" id="prix-pr" step="5" min="0" max="60">



			<h3>Ajouter un avis</h3>
			<form class="formulaire-avis">
				Identifiant de la pièce :<br>
				<input type="number" name="piece-id"><br>
				Nom d'utilisateur :<br>
				<input type="text" name="utilisateur"><br>
				Avis :<br>
				<input type="text" name="commentaire"><br>
				nonbre d'étoiles: <br>
				<input type="number" name="nbEtoiles"><br>
				<button>Envoyer</button>
			</form>

		</section>

		<!-- Fiches produits -->
		<section class="fiches">
		</section>
	</main>
</body>

</html>
